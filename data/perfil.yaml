resumen: >-
  Analista NOC IT enfocado en la continuidad operativa de redes, sistemas y
  servicios de conectividad. Monitoreo con Zabbix, Grafana y Unifi Network
  Application; gestión de incidentes de punta a punta sobre equipamiento
  Huawei y MikroTik; e informes RFO y RDO como insumo del análisis de causa raíz.

diferencial: >-
  Convierto incidentes recurrentes en procedimientos documentados, base de
  conocimiento y automatizaciones que reducen tareas manuales. Ataco la causa
  en lugar del síntoma.

proyeccion: Observabilidad, automatización y análisis de datos aplicados a operaciones de red.

